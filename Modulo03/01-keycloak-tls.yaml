# =============================================================
# NAMESPACE
# =============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak

---
# =============================================================
# PERSISTENT VOLUME - H2 data (hostPath)
# =============================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: keycloak-h2-pv
spec:
  capacity:
    storage: 2Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /data/keycloak-h2
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker01

---
# =============================================================
# PERSISTENT VOLUME CLAIM
# =============================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-h2-pvc
  namespace: keycloak
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 2Gi

---
# =============================================================
# DEPLOYMENT - Keycloak con TLS y H2 persistente
# =============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-worker01
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 1000:1000 /opt/keycloak/data
          volumeMounts:
            - name: h2-storage
              mountPath: /opt/keycloak/data
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:23.0
          args: ["start-dev"]
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: KEYCLOAK_ADMIN
